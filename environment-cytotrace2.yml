# environment-cytotrace2.yml
# CytoTRACE2 细胞分化潜能评估专用环境
#
# 为什么独立：
#   CytoTRACE2（cytotrace2-py）要求 numpy<2.0.0，而主环境 scrna-integration
#   中的 scCRAFT/jax 要求 numpy>=2.0。两者 numpy 需求互斥，必须分离到不同环境。
#
# 何时使用：
#   仅 notebooks/07_downstream/D07_potency_cytotrace2.ipynb 需要。
#   使用前 conda activate scrna-cytotrace2，或在 Jupyter 中切换 kernel。
#
# 安装：
#   conda env create -f environment-cytotrace2.yml

name: scrna-cytotrace2
channels:
  - conda-forge
platforms:
  - linux-64
  - osx-arm64
dependencies:
  - python=3.11.15
  - pip=26.1.2
  - pip:
      - anndata==0.12.16
      - numpy==1.26.4
      - scanpy==1.11.5
      - scipy==1.15.2
      - pandas==2.3.3
      - cytotrace2-py==1.1.0.4
