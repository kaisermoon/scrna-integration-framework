[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scrna-integration-framework"
version = "0.0.1"
description = "Cross-disease, multi-source scRNA-seq integration analysis framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Zhong Zishao", email = "kaisermoon@users.noreply.github.com" }
]
keywords = ["single-cell", "scRNA-seq", "integration", "scanpy", "bioinformatics"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Core deps - kept lean here; specific submodules will gate heavy deps via extras
dependencies = [
    "anndata>=0.10",
    "scanpy>=1.10",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "mygene>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "pre-commit>=3.5",
]
batch = [
    "harmonypy>=0.0.9",
    "scvi-tools>=1.1",
    "scrublet>=0.3",
]
annotation = [
    "decoupler>=1.5",
    "mllmcelltype>=0.1",
    "openai>=1.50",
]
pseudotime = [
    "scvelo>=0.3",
]
downstream = [
    "infercnvpy>=0.4",
    "cellrank>=2.0",
]
abundance = [
    "sccoda>=0.1",
]
rbridge = [
    "rpy2>=3.5",
    "anndata2ri>=0.8",
]
all = [
    "harmonypy>=0.0.9",
    "scvi-tools>=1.1",
    "scrublet>=0.3",
    "decoupler>=1.5",
    "mllmcelltype>=0.1",
    "openai>=1.50",
    "infercnvpy>=0.4",
    "cellrank>=2.0",
    "sccoda>=0.1",
    "rpy2>=3.5",
    "anndata2ri>=0.8",
    "scvelo>=0.3",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "pre-commit>=3.5",
]

[project.urls]
Repository = "https://github.com/kaisermoon/scrna-integration-framework"
Issues = "https://github.com/kaisermoon/scrna-integration-framework/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
