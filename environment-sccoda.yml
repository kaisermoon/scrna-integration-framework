# environment-sccoda.yml
# scCODA 丰度差异分析专用环境（含 TensorFlow）
#
# 为什么独立：
#   scCODA 依赖 tensorflow/tensorflow-probability，而主环境 scrna-integration
#   为了 scCRAFT 训练不 segfault 已移除 TF。TF 的 oneDNN/MKL 与 PyTorch 在
#   同进程 backward 时存在冲突，两者必须分离到不同环境。
#
# 何时使用：
#   仅 notebooks/07_downstream/D09_abundance.ipynb 中 scCODA 细胞丰度差异分析部分需要。
#   使用前 `conda activate scrna-sccoda`，或在 Jupyter 中切换到对应 kernel。
#
# 安装：
#   conda env create -f environment-sccoda.yml
#
# 核心包版本（创建时）：
#   scCODA 0.1.9, tensorflow 2.21.0, tensorflow-probability 0.25.0
#   rpy2 3.6.7 (ABI mode, from conda-forge), R 4.5.3
#
name: scrna-sccoda
channels:
  - conda-forge
  - bioconda
platforms:
  - linux-64
  - osx-arm64
dependencies:
  - python=3.11.15
  - pip=26.1.2
  - r-base=4.5.3
  - rpy2=3.6.7
  - pip:
      - absl-py==2.4.0
