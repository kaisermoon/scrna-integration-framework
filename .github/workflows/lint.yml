name: lint

on:
  push:
    branches: [main]
  pull_request:

# 必需门禁只检查会导致真实执行失败的 Python 错误；风格债务后续分批清理。

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ----- Python (ruff) -----
      - name: Set up Python
        if: hashFiles('pyproject.toml', 'setup.py', 'setup.cfg', 'requirements*.txt') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run ruff
        if: hashFiles('pyproject.toml', 'setup.py', 'setup.cfg', 'requirements*.txt') != ''
        run: |
          pip install ruff
          ruff check src tests scripts \
            notebooks/04_embedded.ipynb \
            notebooks/05_clustered.ipynb \
            notebooks/06b_per_cluster.ipynb \
            --select F821,E9

      # ----- JS / TS (npm run lint) -----
      - name: Set up Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Run npm lint
        if: hashFiles('package.json') != ''
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          if npm run 2>/dev/null | grep -q "^  lint"; then npm run lint; else echo "no lint script; skip"; fi
