name: lint

on:
  push:
    branches: [main]
  pull_request:

# 多语言自适应。各语言 lint 起始为占位（|| true），项目正式启用规则后去掉 || true。

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ----- Python (ruff) -----
      - name: Set up Python
        if: hashFiles('pyproject.toml', 'setup.py', 'setup.cfg', 'requirements*.txt') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run ruff
        if: hashFiles('pyproject.toml', 'setup.py', 'setup.cfg', 'requirements*.txt') != ''
        run: |
          pip install ruff
          ruff check . || true   # 占位：项目正式启用 ruff 规则后去掉 || true

      # ----- R (lintr) -----
      - name: Set up R
        if: hashFiles('DESCRIPTION') != ''
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
      - name: Run lintr
        if: hashFiles('DESCRIPTION') != ''
        run: |
          Rscript -e 'install.packages("lintr")'
          Rscript -e 'lintr::lint_dir(path = ".")' || true   # 占位

      # ----- JS / TS (npm run lint) -----
      - name: Set up Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Run npm lint
        if: hashFiles('package.json') != ''
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          if npm run 2>/dev/null | grep -q "^  lint"; then npm run lint; else echo "no lint script; skip"; fi
