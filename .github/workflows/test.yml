name: test

on:
  push:
    branches: [main]
  # 注：已移除 pull_request 触发——test 仅在 merge 后后台运行，不阻塞 PR 合并

# 混合语言门禁：仓库中存在对应入口时必须真实执行，任一命令失败即失败。

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ----- Python -----
      - name: Set up Python
        if: hashFiles('pyproject.toml', 'setup.py', 'setup.cfg', 'requirements*.txt') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python project dependencies
        if: hashFiles('pyproject.toml', 'setup.py', 'setup.cfg', 'requirements*.txt') != ''
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]"
          fi
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run pytest
        if: hashFiles('pyproject.toml', 'setup.py', 'setup.cfg', 'requirements*.txt') != ''
        run: |
          if [ -d tests ]; then
            pytest tests/ -v
          else
            echo "no tests/ dir; skip pytest"
          fi

      # ----- R entry points -----
      - name: Set up R
        if: hashFiles('scripts/*.R') != ''
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
      - name: Parse R entry points
        if: hashFiles('scripts/*.R') != ''
        run: python scripts/check_r_scripts.py

      # ----- JS / TS -----
      - name: Set up Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Run npm test
        if: hashFiles('package.json') != ''
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          if npm run 2>/dev/null | grep -q "^  test"; then npm test; else echo "no test script; skip"; fi
