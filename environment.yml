# scrna-integration —— Python 主环境源 spec（跨平台一致性，ADR-0010）
#
# 本文件是「期望版本基准」的真相源，版本以 Mac（osx-arm64）已验证环境为准（2026-06-09 导出）。
# 安装方式：conda env create -f environment.yml（或 mamba）。
# 精确 pin（==）已尽量保证两机装出版本一致；装好后跑 `python scripts/env_parity.py snapshot` 留快照，
# 换机时用 `compare` 对差异，人工决定对齐。
#
#   首次安装：  conda env create -f environment.yml
#   新增/升级包：改本文件 → conda install -n scrna-integration <pkg>==<version>
#               → 重跑 `python scripts/env_parity.py snapshot` 更新快照
#
# conda 层锁 python + pip + rpy2；其余科学栈走 pip。
# 平台专属基础库（libcxx 等）交给 conda 按平台求解，不在此手动 pin。
#
# rpy2 为何走 conda 不走 pip（2026-06-10 Linux 实测定）：
#   pip 装 rpy2 需在本机编译并链接 R 共享库；Linux 上 pip rpy2 链接失败（找不到匹配的 R
#   framework 符号）。conda-forge 的 rpy2=3.6.7 在 linux-64 + osx-arm64 都有同版本预编译包，
#   会自动把匹配的 r-base（4.5.x 桥接用）一并拉入本 Python 环境——这是 in-process Python↔R
#   桥接（rpy2/anndata2ri）专用的 R，与 subprocess 调用的 scrna-integration-r（R 4.4.3）
#   职责分离、各自独立。两 R 版本并存为预期设计，见 docs/cross-platform-exceptions.md。
#   anndata2ri 仍走 pip（conda-forge 无此包）。
name: scrna-integration
channels:
  - conda-forge
  - bioconda
platforms:
  - linux-64
  - osx-arm64
dependencies:
  - python=3.11.15
  - pip=26.1.1
  # in-process R 桥接（自动拉入匹配的 r-base，两平台同版本，见上方说明）
  - rpy2=3.6.7
